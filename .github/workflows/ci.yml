name: Continuous Integration & Engineering Quality Gate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    name: Build, Lint, Typecheck & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js Runtime
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Code Formatting Check (Prettier)
        run: npm run format:check

      - name: Static Code Analysis (ESLint)
        run: npm run lint

      - name: TypeScript Type Checking (tsc)
        run: npm run typecheck

      - name: Unit & Integration Test Suite (Vitest)
        run: npm run test

      - name: Compile & Build Application Bundles
        run: npm run build
